plugins {
    id 'com.android.application'
}

android {
    namespace 'io.github.jay11111205boop.subledger'
    compileSdk 35

    defaultConfig {
        applicationId 'io.github.jay11111205boop.subledger'
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName '1.0.0'
    }

    // A stable signing key is used only when the build provides one through
    // environment variables (see the README). Otherwise the debug key signs
    // the release so the APK still installs.
    signingConfigs {
        release {
            def keystorePath = System.getenv('KEYSTORE_PATH')
            if (keystorePath) {
                storeFile file(keystorePath)
                storePassword System.getenv('KEYSTORE_PASSWORD')
                keyAlias System.getenv('KEY_ALIAS')
                keyPassword System.getenv('KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig System.getenv('KEYSTORE_PATH') ? signingConfigs.release : signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

// The app has no library dependencies at all.
dependencies {
}
